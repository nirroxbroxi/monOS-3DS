name: Build 3DS FIRM

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build FIRM
        run: make

      - name: Upload boot.firm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot.firm
          path: boot.firm
